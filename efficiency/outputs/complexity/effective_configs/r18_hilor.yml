task: detection
num_classes: 5
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ${RELEASE_ROOT}/main_host/datasets/CDW1630/train2017
    ann_file: ${RELEASE_ROOT}/main_host/datasets/CDW1630/annotations/instances_train2017.json
    transforms:
      type: Compose
      ops:
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBox
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 640
        - 640
      - type: ToImageTensor
      - type: ConvertDtype
      - type: SanitizeBoundingBox
        min_size: 1
      - type: ConvertBox
        out_fmt: cxcywh
        normalize: true
    return_masks: false
  shuffle: true
  batch_size: 4
  num_workers: 4
  drop_last: true
  collate_fn: default_collate_fn
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ${RELEASE_ROOT}/main_host/datasets/CDW1630/val2017
    ann_file: ${RELEASE_ROOT}/main_host/datasets/CDW1630/annotations/instances_val2017.json
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ToImageTensor
      - type: ConvertDtype
  shuffle: false
  batch_size: 8
  num_workers: 4
  drop_last: false
  collate_fn: default_collate_fn
sync_bn: false
find_unused_parameters: false
use_amp: false
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000
epoches: 102
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?=.*norm).*$
    lr: 1.0e-05
    weight_decay: 0.0
  - params: ^(?=.*backbone)(?!.*norm).*$
    lr: 1.0e-05
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bias)).*$
    weight_decay: 0.0
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 1000
  gamma: 0.1
model: RTDETR
criterion: HiLoRSetCriterion
postprocessor: HiLoRRTDETRPostProcessor
RTDETR:
  backbone: PResNet
  encoder: HybridEncoder
  decoder: RTDETRTransformer
  multi_scale:
  - 480
  - 512
  - 544
  - 576
  - 608
  - 640
  - 640
  - 640
  - 672
  - 704
  - 736
  - 768
  - 800
PResNet:
  depth: 18
  variant: d
  freeze_at: -1
  return_idx:
  - 1
  - 2
  - 3
  num_stages: 4
  freeze_norm: false
  pretrained: false
HybridEncoder:
  in_channels:
  - 128
  - 256
  - 512
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  pe_temperature: 10000
  expansion: 0.5
  depth_mult: 1
  act: silu
  eval_spatial_size:
  - 640
  - 640
RTDETRTransformer:
  feat_channels:
  - 256
  - 256
  - 256
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  num_levels: 3
  num_queries: 300
  num_decoder_layers: 3
  num_denoising: 100
  eval_idx: -1
  eval_spatial_size:
  - 640
  - 640
  ufd_enabled: true
  ufd_reg_max: 32
  ufd_reg_scale: 4.0
  ufd_up: 0.5
  hilor_return_decoder_features: true
use_focal_loss: true
RTDETRPostProcessor:
  num_top_queries: 300
  umr_checkpoint: ${RELEASE_ROOT}/second_host/artifacts/inference/seed0/umr_seed0_pw4_best.pt
SetCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
  losses:
  - vfl
  - boxes
  alpha: 0.75
  gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
output_dir: ${RELEASE_ROOT}/efficiency/complexity/outputs/r18_hilor
checkpoint_step: 999
HiLoRSetCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
  losses:
  - vfl
  - boxes
  alpha: 0.75
  gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
  lcct_enabled: true
  lcct_warmup_epoch: 20
  lcct_delta: 0.02
  lcct_continuous_handover: true
  lcct_transition_width: 0.02
  lcct_ramp_epochs: 5
  ufd_enabled: true
  ufd_cdf_path: ${RELEASE_ROOT}/second_host/inputs/difficulty_cdf_train640.json
  ufd_total_epochs: 102
  ufd_k: 9
  ufd_base_size: 640.0
  ufd_alpha_h: 0.5
  ufd_alpha_u_max: 0.0
  ufd_lambda_max: 0.75
  ufd_lambda_ramp_fraction: 0.05
  ufd_reg_max: 32
seed: 0
device: cuda:0
HiLoRRTDETRPostProcessor:
  num_classes: 5
  use_focal_loss: true
  num_top_queries: 300
  remap_mscoco_category: false
  qccr_enabled: true
  umr_enabled: true
  num_queries: 300
  artifact_manifest:
    path: artifacts/inference/seed0/qccr_umr_binding.json
    path_base: adapter_root
    sha256: b8ca33ed8015576f9ad9b3d86fd5fd28eefa08413a43b43fa1c801cd942eae70
  expected_detector_checkpoint_sha256: 312bea63c1f74d7880ae335360cba9ccda1826c8b0a5bb8b7d3fbb648ae73ddd
  allow_unbound_artifacts: false
