# CDW1630 D-FINE-M: authoritative Train/Val, predeclared budget.
__include__: ["/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/benchmarks/03_D_FINE_M/source/D-FINE_official/configs/dfine/custom/dfine_hgnetv2_m_custom.yml"]
num_classes: 5
remap_mscoco_category: False
HGNetv2:
  pretrained: False
epochs: 102
use_amp: False
use_ema: True
checkpoint_freq: 999
optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00000625
    - params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00000625
      weight_decay: 0.
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0000625
  betas: [0.9, 0.999]
  weight_decay: 0.000125
train_dataloader:
  dataset:
    img_folder: "/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/main_host/datasets/CDW1630/train2017"
    ann_file: "/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/main_host/datasets/CDW1630/annotations/instances_train2017.json"
    transforms:
      policy:
        epoch: 90
  total_batch_size: 8
  num_workers: 4
  collate_fn:
    stop_epoch: 90
    ema_restart_decay: 0.9999
    base_size_repeat: 6
val_dataloader:
  dataset:
    img_folder: "/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/main_host/datasets/CDW1630/val2017"
    ann_file: "/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/main_host/datasets/CDW1630/annotations/instances_val2017.json"
  total_batch_size: 8
  num_workers: 4
