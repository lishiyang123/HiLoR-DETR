output_dir: "/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/benchmarks/02_RT_DETR_R18/runs/OUTPUT_IS_SET_BY_RUNNER"
num_classes: 5
remap_mscoco_category: False
sync_bn: False
find_unused_parameters: False
epoches: 102
use_amp: False
use_ema: True
checkpoint_step: 999
PResNet:
  pretrained: False
optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?=.*norm).*$'
      lr: 0.00001
      weight_decay: 0.
