task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
num_classes: 5
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ${RELEASE_ROOT}/main_host/datasets/CDW1630/train2017
    ann_file: ${RELEASE_ROOT}/main_host/datasets/CDW1630/annotations/instances_train2017.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size: 320
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        probability: 1.0
        fill_value: 0
        use_cache: false
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch:
        - 4
        - 49
        - 90
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
      mosaic_prob: 0.5
  shuffle: true
  num_workers: 4
  drop_last: true
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 6
    stop_epoch: 90
    ema_restart_decay: 0.9999
    mixup_prob: 0.5
    mixup_epochs:
    - 4
    - 49
  total_batch_size: 8
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ${RELEASE_ROOT}/main_host/datasets/CDW1630/test2017
    ann_file: ${RELEASE_ROOT}/main_host/datasets/CDW1630/annotations/instances_test2017.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
  shuffle: false
  num_workers: 0
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 8
print_freq: 100
checkpoint_freq: 4
sync_bn: false
find_unused_parameters: false
use_amp: false
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
epoches: 102
clip_max_norm: 0.1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*bn).*$
    lr: 1.0e-05
  - params: ^(?=.*(?:norm|bn)).*$
    weight_decay: 0.0
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 500
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor
use_focal_loss: true
eval_spatial_size:
- 640
- 640
DEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 20
flat_epoch: 49
no_aug_epoch: 12
HGNetv2:
  pretrained: false
  local_model_dir: ../RT-DETR-main/D-FINE/weight/hgnetv2/
  name: B2
  return_idx:
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  use_lab: true
HybridEncoder:
  in_channels:
  - 384
  - 768
  - 1536
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 1.0
  depth_mult: 0.67
  act: silu
DFINETransformer:
  feat_channels:
  - 256
  - 256
  - 256
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  num_levels: 3
  num_layers: 4
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points:
  - 3
  - 6
  - 3
  cross_attn_method: default
  query_select_method: default
  activation: silu
  mlp_act: silu
  ufd_enabled: true
  ufd_deploy_strip: true
PostProcessor:
  num_top_queries: 300
  qccr_enabled: true
  umr_enabled: true
  umr_checkpoint: ${RELEASE_ROOT}/main_host/checkpoints/CDW1630/Ours/seed1/calibration/umr_mlp_head_seed0_pw4.pt
  umr_topk: 300
  umr_tau: 0.0
  umr_beta: 2.0
  qccr_beta0: 1.951855764359433
  qccr_beta_negative: 2.7537889774388282
  qccr_beta_positive: 1.6396556361412895
  qccr_duplicate_penalty: 0.6354392564728703
DEIMCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mal: 1
  losses:
  - mal
  - boxes
  - local
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
  ufd_enabled: true
  ufd_cdf_path: ${SOURCE_ROOT}/artifacts/ufd/cdw_difficulty_cdf_train640.json
  ufd_total_epochs: 102
  ufd_k: 9
  ufd_base_size: 640.0
  ufd_alpha_h: 0.5
  ufd_alpha_u_max: 0.5
  ufd_lambda_max: 0.75
  ufd_lambda_ramp_fraction: 0.05
  ufd_uncertainty_delay_fraction: 0.05
  ufd_uncertainty_ramp_fraction: 0.05
  lcct_enabled: true
  lcct_warmup_epoch: 20
  lcct_delta: 0.02
  lcct_continuous_handover: true
  lcct_transition_width: 0.02
  lcct_ramp_epochs: 5
