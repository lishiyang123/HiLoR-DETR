__include__: [
  '../deim_dfine/deim_hgnetv2_m_coco.yml'
]

num_classes: 3
remap_mscoco_category: False

HGNetv2:
  pretrained: False

epoches: 102
warmup_iter: 20

output_dir: ${RELEASE_ROOT}/generalization/btc/outputs/B0_DEIM_BTC_v1/formal_seed0

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  dataset:
    img_folder: ${RELEASE_ROOT}/generalization/btc/data/coco_deim/train2017
    ann_file: ${RELEASE_ROOT}/generalization/btc/data/coco_deim/annotations/instances_train.json
  total_batch_size: 8
  num_workers: 4

val_dataloader:
  dataset:
    img_folder: ${RELEASE_ROOT}/generalization/btc/data/coco_deim/val2017
    ann_file: ${RELEASE_ROOT}/generalization/btc/data/coco_deim/annotations/instances_val.json
  total_batch_size: 8
  num_workers: 4
