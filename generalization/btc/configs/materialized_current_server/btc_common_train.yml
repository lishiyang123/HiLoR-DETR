num_classes: 3
remap_mscoco_category: False

HGNetv2:
  pretrained: False

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 102
warmup_iter: 20

train_dataloader:
  dataset:
    img_folder: "/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/generalization/btc/data/coco_deim/train2017"
    ann_file: "/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/generalization/btc/data/coco_deim/annotations/instances_train.json"
  total_batch_size: 8
  num_workers: 4

val_dataloader:
  dataset:
    img_folder: "/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/generalization/btc/data/coco_deim/val2017"
    ann_file: "/root/autodl-tmp/BTC_DEIM_project/RELEASE_RENAME_TRIAL_20261015/HiLoR-DETR/generalization/btc/data/coco_deim/annotations/instances_val.json"
  total_batch_size: 8
  num_workers: 4

PostProcessor:
